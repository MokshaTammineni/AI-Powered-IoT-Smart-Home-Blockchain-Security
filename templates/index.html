<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE.AI // COMMAND CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0a0a0a;
            --text-primary: #00ff41;
            /* Matrix Green */
            --text-secondary: #008F11;
            --alert-color: #ff003c;
            /* Cyberpunk Red */
            --border-color: #1a1a1a;
            --glow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            height: 100vh;
            background-image:
                linear-gradient(rgba(0, 10, 0, 0.9), rgba(0, 10, 0, 0.9)),
                repeating-linear-gradient(0deg, transparent, transparent 1px, #003300 1px, #003300 2px);
            background-size: 100% 3px;
        }

        /* --- LAYOUT --- */
        .grid-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            /* Video takes more space */
            grid-template-rows: auto 1fr;
            gap: 20px;
            height: 100%;
        }

        /* --- HEADER --- */
        .header {
            grid-column: 1 / -1;
            border-bottom: 2px solid var(--text-secondary);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            text-shadow: var(--glow);
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        .stats-bar {
            display: flex;
            gap: 30px;
            font-size: 1.1rem;
        }

        .stat-item span {
            color: #fff;
        }

        /* --- PANELS --- */
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--text-secondary);
            position: relative;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.1);
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 10px;
            height: 10px;
            border-top: 2px solid var(--text-primary);
            border-left: 2px solid var(--text-primary);
        }

        .panel::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            border-bottom: 2px solid var(--text-primary);
            border-right: 2px solid var(--text-primary);
        }

        .panel-title {
            position: absolute;
            top: -12px;
            left: 20px;
            background: var(--bg-color);
            padding: 0 10px;
            color: var(--text-primary);
            font-weight: bold;
            border: 1px solid var(--text-secondary);
        }

        /* --- VIDEO FEED --- */
        .video-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 1px solid #333;
            position: relative;
        }

        .video-feed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) brightness(1.1);
            /* Slight enhancement */
        }

        .overlay-rec {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--alert-color);
            font-weight: bold;
            animation: blink 1s infinite;
        }

        /* --- BLOCKCHAIN --- */
        .blockchain-feed {
            overflow-y: auto;
            height: 90%;
            padding-right: 10px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
        }

        .block {
            border-left: 2px solid var(--text-secondary);
            margin-left: 10px;
            padding: 15px;
            position: relative;
            margin-bottom: 20px;
            background: rgba(0, 20, 0, 0.5);
            transition: all 0.3s ease;
        }

        .block::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 20px;
            width: 10px;
            height: 10px;
            background: var(--text-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--text-primary);
        }

        .block.alert {
            border-left: 2px solid var(--alert-color);
            background: rgba(50, 0, 0, 0.3);
        }

        .block.alert::before {
            background: var(--alert-color);
            box-shadow: 0 0 10px var(--alert-color);
        }

        .hash-code {
            font-size: 0.7rem;
            color: #666;
            margin-top: 5px;
            word-break: break-all;
        }

        /* --- ANIMATIONS --- */
        @keyframes blink {
            0% {
                opacity: 1;
                text-shadow: 0 0 10px red;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
                text-shadow: 0 0 10px red;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div>
            <h1>SECURE.AI <span style="font-size: 1rem; color: #666;">v2.0</span></h1>
        </div>
        <div class="stats-bar">
            <div class="stat-item">SYS_STATUS: <span style="color: var(--text-primary);">ONLINE</span></div>
            <div class="stat-item">THREAT_LEVEL: <span id="threat-level" style="color: var(--text-primary);">LOW</span>
            </div>
            <div class="stat-item">UPTIME: <span id="uptime">00:00:00</span></div>
        </div>
    </div>

    <div class="grid-container">
        <!-- VIDEO FEED -->
        <div class="panel">
            <div class="panel-title">LIVE_OPTICAL_SENSOR</div>
            <div class="video-container">
                <div class="overlay-rec">● REC</div>
                <img src="{{ url_for('video_feed') }}" alt="Live Feed">
                <!-- Grid overlay for "sci-fi" effect -->
                <div style="position: absolute; top:0; left:0; width:100%; height:100%; 
                            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
                            z-index: 2; pointer-events: none; background-size: 100% 2px, 3px 100%;"></div>
            </div>
        </div>

        <!-- BLOCKCHAIN LOGS -->
        <div class="panel">
            <div class="panel-title">IMMUTABLE_LEDGER</div>
            <div class="blockchain-feed" id="chain-container">
                {% for block in chain %}
                <div class="block {{ 'alert' if block.data.event == 'INTRUSION' else '' }}">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <strong style="color: #fff;">BLOCK #{{ block.index }}</strong>
                        <span style="border: 1px solid currentColor; padding: 2px 5px; font-size: 0.8rem;">
                            {{ block.data.event }}
                        </span>
                    </div>
                    <div style="margin-top: 5px; font-size: 1.2rem;">
                        ID: {{ block.data.person }}
                    </div>
                    <div style="font-size: 0.8rem; opacity: 0.7;">{{ block.timestamp }}</div>
                    <div class="hash-code">HASH: {{ block.hash }}</div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        // Update Uptime
        let seconds = 0;
        setInterval(() => {
            seconds++;
            const date = new Date(0);
            date.setSeconds(seconds);
            document.getElementById('uptime').innerText = date.toISOString().substr(11, 8);
        }, 1000);

        // Auto-refresh ONLY the blockchain part would be better, but for now full reload serves the purpose
        // to invoke the Jinja2 template engine again.
        setTimeout(() => {
            window.location.reload();
        }, 5000);
    </script>
</body>

</html>
